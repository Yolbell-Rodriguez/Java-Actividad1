<form th:action="@{/guarda}" method="post">
    <label>Nombre <input type="text" name="nombre" required></label><br>
    <label>Precio <input type="number" step="0.01" name="precio" required></label><br>
    <label>Tipo
        <select name="tipo">
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
        </select>
    </label><br>
    <fieldset>
        <legend>Ingredientes</legend>
        <label th:each="ing : ${ingredientesDisponibles}">
            <input type="checkbox" name="ingredientes" th:value="${ing}">
            <span th:text="${ing}"></span>
        </label>
    </fieldset>

    <button type="submit">Guardar</button>
</form>
